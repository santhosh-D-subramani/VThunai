name: Build iOS IPA

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "source.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build_ios:
    name: Build iOS
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.4.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
          echo "Selected Xcode:"
          xcode-select -p
          echo "Xcode version:"
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: "stable"
          cache: true

      - name: Verify Flutter
        run: |
          flutter --version
          flutter doctor -v

      - name: Set version info
        id: vars
        run: |
          FULL_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '\r')
          VERSION=$(echo "$FULL_VERSION" | cut -d'+' -f1)
          BUILD=$(echo "$FULL_VERSION" | cut -d'+' -f2)
          echo "Full: $FULL_VERSION | Version: $VERSION | Build: $BUILD"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%S-00:00)" >> "$GITHUB_OUTPUT"

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build iOS (No Codesign)
        run: |
          flutter build ios \
            --release \
            --no-codesign

      - name: Create IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          rm -f VThunai.ipa
          zip -r VThunai.ipa Payload
          echo "IPA created:"
          ls -lh VThunai.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VThunai_ios
          path: VThunai.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.vars.outputs.version }}
          name: V ${{ steps.vars.outputs.version }}
          draft: false
          prerelease: false
          files: VThunai.ipa
          body: |
            VThunai v${{ steps.vars.outputs.version }}

            ### iOS
            Use a sideloader like [AltStore](https://altstore.io/) or [SideStore](https://sidestore.io/) (or any other iOS sideloader) to sideload `VThunai.ipa`.

      - name: Update source.json
        env:
          APP_VERSION: ${{ steps.vars.outputs.version }}
          BUILD_DATE: ${{ steps.vars.outputs.date }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import json
          import os

          version = os.environ["APP_VERSION"]
          date = os.environ["BUILD_DATE"]
          repo = os.environ["GITHUB_REPO"]
          size = os.path.getsize("VThunai.ipa")
          download_url = f"https://github.com/{repo}/releases/download/v{version}/VThunai.ipa"

          with open("source.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          new_entry = {
              "version": version,
              "date": date,
              "size": size,
              "downloadURL": download_url,
              "localizedDescription": f"Automated build {version}",
          }

          versions = [
              v for v in data["apps"][0].get("versions", [])
              if v.get("version") != version
          ]
          data["apps"][0]["versions"] = [new_entry] + versions

          with open("source.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=4)
              f.write("\n")
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source.json
          if ! git diff --cached --quiet; then
            git commit -m "Chore: update source.json for v${{ steps.vars.outputs.version }} [skip ci]"
            git pull --rebase
            git push
          fi
